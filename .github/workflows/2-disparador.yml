name: "2. Resultados - Detectar y scrapear"

# El precheck comparte la política de reintentos con el scraper y usa solo stdlib.
# Solo se instala Python/dependencias/navegador si hay consultas pendientes.
on:
  schedule:
    - cron: '7-59/10 7-23,0-1 * * *'
      timezone: Europe/Madrid
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scraper-escritura
  queue: max
  cancel-in-progress: false

jobs:
  detectar-y-scrapear:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TZ: Europe/Madrid
      SCRAPER_PENDING_FILE: .scraper-pending.json
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Comprobar partidos pendientes
        id: check
        env:
          CENTRAL_SUPABASE_URL: ${{ secrets.CENTRAL_SUPABASE_URL }}
          CENTRAL_SUPABASE_SERVICE_KEY: ${{ secrets.CENTRAL_SUPABASE_SERVICE_KEY }}
        run: python3 scraper_precheck.py

      - name: Setup Python
        if: steps.check.outputs.pendientes == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Cache Playwright
        if: steps.check.outputs.pendientes == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('requirements.txt') }}

      - name: Instalar dependencias de scraping
        if: steps.check.outputs.pendientes == 'true'
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Scraping de resultados
        if: steps.check.outputs.pendientes == 'true'
        env:
          CENTRAL_SUPABASE_URL: ${{ secrets.CENTRAL_SUPABASE_URL }}
          CENTRAL_SUPABASE_SERVICE_KEY: ${{ secrets.CENTRAL_SUPABASE_SERVICE_KEY }}
        run: |
          set -o pipefail
          xvfb-run --auto-servernum --server-args="-screen 0 1366x768x24" \
            python scraper_resultados.py 2>&1 | tee resultados.log

      - name: Resumen
        if: always()
        run: |
          echo "### Resultados" >> "$GITHUB_STEP_SUMMARY"
          echo "**Hora España:** $(date '+%d/%m/%Y %H:%M')" >> "$GITHUB_STEP_SUMMARY"
          echo "**Estado:** ${{ job.status }}" >> "$GITHUB_STEP_SUMMARY"
          echo "**Partidos pendientes:** ${{ steps.check.outputs.num || '0' }}" >> "$GITHUB_STEP_SUMMARY"
          if [ -f resultados.log ]; then
            RESULT_COUNT=$(sed -n 's/^RESULT_COUNT=\([0-9][0-9]*\)$/\1/p' resultados.log | tail -n 1)
            echo "**Resultados nuevos:** ${RESULT_COUNT:-no disponible}" >> "$GITHUB_STEP_SUMMARY"
          elif [ "${{ steps.check.outcome }}" = "success" ] && [ "${{ steps.check.outputs.pendientes }}" = "false" ]; then
            echo "No hay consultas pendientes; no se ha instalado ni iniciado el navegador." >> "$GITHUB_STEP_SUMMARY"
          fi
