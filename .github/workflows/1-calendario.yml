name: "1. Calendario - Actualizar fechas y horarios"

# Dos pasadas generales diarias; la zona horaria sigue el cambio de hora.
on:
  schedule:
    - cron: '17 12 * * *'
      timezone: Europe/Madrid
    - cron: '47 23 * * *'
      timezone: Europe/Madrid
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scraper-escritura
  queue: max
  cancel-in-progress: false

jobs:
  actualizar-calendario:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TZ: Europe/Madrid
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Cache Playwright
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('requirements.txt') }}

      - name: Instalar dependencias
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Ejecutar scraper completo
        env:
          CENTRAL_SUPABASE_URL: ${{ secrets.CENTRAL_SUPABASE_URL }}
          CENTRAL_SUPABASE_SERVICE_KEY: ${{ secrets.CENTRAL_SUPABASE_SERVICE_KEY }}
        run: |
          xvfb-run --auto-servernum --server-args="-screen 0 1366x768x24" \
            python scraper_competicion.py

      - name: Resumen
        if: always()
        run: |
          echo "### Calendario general" >> "$GITHUB_STEP_SUMMARY"
          echo "**Hora España:** $(date '+%d/%m/%Y %H:%M')" >> "$GITHUB_STEP_SUMMARY"
          echo "**Estado:** ${{ job.status }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Ejecuciones diarias a las 12:17 y 23:47 (Europe/Madrid)." >> "$GITHUB_STEP_SUMMARY"
